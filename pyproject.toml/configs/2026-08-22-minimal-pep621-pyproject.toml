# last_verified: 2026-08-22 · pyproject.toml PEP 621

# ── Minimal PEP 621 pyproject.toml ─────────────────────────────────────
# This is the smallest config that covers all three core tables:
# [build-system], [project], and [tool] sections.
# I put this together after getting confused by which table does what.

[build-system]
# hatchling is lightweight and PEP 517/621 compliant — works well with uv
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-minimal-project"
version = "0.1.0"
description = "A minimal PEP 621 project with build, metadata, and tool config"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

# ── Tool configuration ─────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
