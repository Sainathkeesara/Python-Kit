[tool.ruff]
# Rule selection — started with recommended set, trimmed noise
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N802", "N806"]

# Excludes — don't lint generated or vendored code
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

# Target Python version
target-version = "py311"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["N"]
