[tox]
# I started with just py311 but the docs showed a lint env as standard
# practice — having both means I can gate on lint before running tests
envlist = lint,py311

[testenv]
# pytest is the default test runner so I put it as the base dep;
# leaving install on because the test env typically needs the project
deps =
    pytest
commands =
    python -m pytest {posargs}

[testenv:lint]
# skip_install makes sense here — linting doesn't need the project built,
# just the linter itself. Found this pattern in the tox docs.
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs:.}
