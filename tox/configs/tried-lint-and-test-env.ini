[tox]
# I tried using just py311 at first but the docs example showed a lint env
# so I added both — seems like the standard way to structure it
envlist = lint,py311

[testenv]
# The quickstart used pytest as the default deps, so I'm following that
# Not sure if skip_install matters here but the default testenv usually
# needs the project installed — leaving install on
deps =
    pytest
commands =
    python -m pytest {posargs}

[testenv:lint]
# Found this in the tox docs — skip_install for linters makes sense
# since we don't need the project installed just to check code style
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs:.}
