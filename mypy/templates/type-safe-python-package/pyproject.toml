[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "type-safe-pkg"
version = "0.1.0"
requires-python = ">=3.10"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["build/", "dist/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]