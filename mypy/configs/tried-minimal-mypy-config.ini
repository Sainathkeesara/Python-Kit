[mypy]
# Three flags the official quickstart highlights:
# strict — shorthand that enables disallow_untyped_defs and a bunch
#          of other strictness flags. Equivalent to passing --strict
#          on the command line.
# disallow_untyped_defs — fail on functions without type annotations.
# ignore_missing_imports — suppress errors for packages without stubs.
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Exclude generated or vendored directories so they don't pollute output.
exclude = build/|migrations/|venv/|.venv/

[per-module-strict]
# Apply strict checks only inside the src/ tree so tests and scripts
# can start untyped and get stricter gradually.
src/* = strict=True
