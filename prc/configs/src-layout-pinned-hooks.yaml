# last_verified: 2026-09-02 · pre-commit n/a
# .pre-commit-config.yaml — src-layout project with pinned ruff, mypy, and pytest hooks across stages
# Each repo section defines per-repo hook ids; stages restrict which hooks fire on commit vs push.

default_stages: [commit, push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [commit]
      - id: end-of-file-fixer
        stages: [commit]
      - id: check-ast
        stages: [commit]
      - id: check-yaml
        stages: [commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        stages: [commit]
      - id: ruff-format
        stages: [commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^src/
        stages: [push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        stages: [push]
